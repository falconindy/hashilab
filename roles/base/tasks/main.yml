- name: Install Apt packages
  ansible.builtin.apt:
    name:
      - linux-sysctl-defaults
      - vim
    dpkg_options: "force-confdef,force-confold"
    state: present

- name: Setup sane editor
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim.basic

- name: Create clusterdata mount point
  ansible.builtin.file:
    state: directory
    path: /clusterdata
    owner: root
    group: root
    mode: "0755"

- name: Add clusterdata mount point to fstab
  ansible.posix.mount:
    path: /clusterdata
    src: nasty.node.home:/volume1/clusterdata
    fstype: nfs4
    opts: nolock,x-systemd.automount,x-systemd.device-timeout=60
    dump: 0
    passno: 0
    state: present
