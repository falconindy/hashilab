- name: Install Apt packages
  ansible.builtin.apt:
    name:
      - nomad
      - nomad-driver-exec2
      - docker.io
    dpkg_options: "force-confdef,force-confold"
    state: present
  notify:
    - Flag nomad restart

# Point the Docker daemon at our registry running in pull-through-cache mode so
# docker.io image pulls are cached locally. registry-mirrors is a reload-safe
# daemon option, so the handler reloads (SIGHUP) rather than restarting Docker —
# no running containers are disrupted.
- name: Configure Docker registry mirror (Docker Hub pull-through cache)
  ansible.builtin.copy:
    src: os/etc/docker/daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify:
    - Reload docker

- name: Perform hardware discovery
  ansible.builtin.include_tasks: discovery.yml

# Debian's cni-plugins package is ancient. Download directly from upstream into
# a versioned directory; /opt/cni/bin is a symlink to the active version, so
# each upgrade lands in a clean directory and the cutover is atomic.
- name: Create versioned CNI plugins directory
  ansible.builtin.file:
    path: "/opt/cni/plugins-v{{ nomad_cni_plugins_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'nomad_clients' in group_names"

- name: Check if CNI plugins are already at the desired version
  ansible.builtin.stat:
    path: "/opt/cni/plugins-v{{ nomad_cni_plugins_version }}/bridge"
  register: nomad_cni_bridge
  when: "'nomad_clients' in group_names"

- name: Download CNI plugins tarball
  vars:
    _ver: "{{ nomad_cni_plugins_version }}"
    _arch: "{{ nomad_cni_arch_map[ansible_facts['architecture']] }}"
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ _ver }}/cni-plugins-linux-{{ _arch }}-v{{ _ver }}.tgz"
    dest: "/opt/cni/cni-plugins-v{{ _ver }}-{{ _arch }}.tgz"
    mode: "0644"
  when:
    - "'nomad_clients' in group_names"
    - not nomad_cni_bridge.stat.exists

- name: Extract CNI plugins into versioned directory
  vars:
    _ver: "{{ nomad_cni_plugins_version }}"
    _arch: "{{ nomad_cni_arch_map[ansible_facts['architecture']] }}"
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - "/opt/cni/cni-plugins-v{{ _ver }}-{{ _arch }}.tgz"
      - -C
      - "/opt/cni/plugins-v{{ _ver }}"
    creates: "/opt/cni/plugins-v{{ _ver }}/bridge"
  when:
    - "'nomad_clients' in group_names"
    - not nomad_cni_bridge.stat.exists

- name: Point /opt/cni/bin at the active plugin version
  ansible.builtin.file:
    src: "/opt/cni/plugins-v{{ nomad_cni_plugins_version }}"
    dest: /opt/cni/bin
    state: link
    force: true
  when: "'nomad_clients' in group_names"

# consul-cni is installed by the consul apt package; expose it in /opt/cni/bin
# so Nomad's CNI plugin discovery finds it alongside the other plugins.
- name: Symlink consul-cni into /opt/cni/bin
  ansible.builtin.file:
    src: /usr/bin/consul-cni
    dest: /opt/cni/bin/consul-cni
    state: link
  when: "'nomad_clients' in group_names"

# The Nomad agent's Consul token (nomad-agent policy) rendered into base.hcl's
# consul.token. Minted by tofu (module.consul_acl) and stashed in Vault KV. Read
# via a controller-side lookup, NOT a delegate_to:localhost vault_read: the
# "Deploy All" play is become:true, which sudo-scrubs VAULT_TOKEN from delegated
# tasks; lookups evaluate in the ansible-playbook process, where the OIDC login
# token (~/.vault-token) is still available.
- name: Read the Nomad agent's Consul token from Vault
  ansible.builtin.set_fact:
    nomad_agent_token: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'consul/tokens/nomad-agent',
                engine_mount_point='kv', url=vault_addr).secret.token }}
  no_log: true
  when: "'nomad_clients' in group_names"

# base.hcl holds the Nomad agent's Consul token, so it's 0600 (root:root — the
# nomad service runs as root and reads it). client.hcl carries no secret → 0644.
- name: Update nomad client config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: os/etc/nomad.d/base.hcl.j2
      dest: /etc/nomad.d/base.hcl
      mode: "0600"
    - src: os/etc/nomad.d/client.hcl.j2
      dest: /etc/nomad.d/client.hcl
      mode: "0644"
  when: "'nomad_clients' in group_names"
  notify:
    - Flag nomad restart

# The gossip encryption key for the server Serf pool (symmetric, shared by the
# servers), rendered into server.hcl's `encrypt`. Only servers gossip in Nomad, so
# this is server-only. Like Consul: running servers ignore it and rotate via
# `nomad operator gossip keyring` (see RUNBOOK); KV holds the current primary so a
# from-scratch server bootstraps on the real key.
- name: Read the Nomad gossip key from Vault
  ansible.builtin.set_fact:
    nomad_gossip_key: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'nomad/gossip',
                engine_mount_point='kv', url=vault_addr).secret.key }}
  no_log: true
  when: "'nomad_servers' in group_names"

- name: Update nomad server config
  ansible.builtin.template:
    src: os/etc/nomad.d/server.hcl.j2
    dest: /etc/nomad.d/server.hcl
    mode: "0600"
  when: "'nomad_servers' in group_names"
  notify:
    - Flag nomad restart

- name: Enable systemd services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  with_list:
    - docker.service
    - nomad.service

- name: Deploy sysctl settings
  ansible.builtin.copy:
    src: os/etc/sysctl.d/bridge.conf
    dest: /etc/sysctl.d
    mode: "0644"
  notify:
    - Apply sysctl
