- name: Install consul packages
  ansible.builtin.apt:
    name:
      - consul
      - consul-cni
  notify:
    - Flag consul restart

# The agent token (consul-agent policy) rendered into consul.hcl's acl.tokens
# block. Minted by tofu (module.consul_acl) and stashed in Vault KV. Read via a
# controller-side lookup, NOT a delegate_to:localhost vault_read: the "Deploy
# All" play is become:true, which sudo-scrubs VAULT_TOKEN from delegated tasks;
# lookups evaluate in the ansible-playbook process, where the OIDC login token
# (~/.vault-token) is still available.
- name: Read the Consul agent token from Vault
  ansible.builtin.set_fact:
    consul_agent_token: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'consul/tokens/consul-agent',
                engine_mount_point='kv', url=vault_addr).secret.token }}
  no_log: true

# The gossip encryption key (symmetric, shared by every agent), rendered into
# consul.hcl's `encrypt`. Running agents ignore it — the live key lives in each
# agent's persisted keyring, rotated via `consul keyring` (see RUNBOOK) — but a
# from-scratch agent bootstraps on it, so KV holds the current primary and we
# render the real value rather than a dummy. Same controller-side lookup rationale
# as the tokens above.
- name: Read the Consul gossip key from Vault
  ansible.builtin.set_fact:
    consul_gossip_key: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'consul/gossip',
                engine_mount_point='kv', url=vault_addr).secret.key }}
  no_log: true

# The Connect CA AppRole role_id, rendered into server.hcl's connect.ca_config
# auth_method. Consul servers log in to Vault with this (keyless, role_id alone)
# to run the Vault Connect CA provider; clients don't run the CA, so servers only.
# Minted by tofu (module.vault_pki_int_connect) and stashed in Vault KV. Same
# controller-side lookup rationale as the tokens above.
- name: Read the Consul Connect CA role_id from Vault
  ansible.builtin.set_fact:
    consul_connect_ca_role_id: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'consul/connect-ca',
                engine_mount_point='kv', url=vault_addr).secret.role_id }}
  when: "'consul_servers' in group_names"

# consul.hcl holds the gossip key and the two ACL tokens, so it's owner consul +
# 0600 — only the consul user (which the daemon runs as) can read it, matching how
# the synology role deploys nasty's. consul.env carries no secret, so stays 0644.
- name: Deploy consul base config
  ansible.builtin.template:
    src: os/etc/consul.d/consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: "0600"
  notify:
    - Flag consul restart

- name: Deploy consul env
  ansible.builtin.template:
    src: os/etc/consul.d/consul.env
    dest: /etc/consul.d/consul.env
    mode: "0644"
  notify:
    - Flag consul restart

# server.hcl now carries the Connect CA AppRole role_id (connect.ca_config), so
# owner consul + 0600 like consul.hcl — only the daemon's user can read it.
- name: Deploy consul server config
  ansible.builtin.template:
    src: os/etc/consul.d/server.hcl.j2
    dest: /etc/consul.d/server.hcl
    owner: consul
    group: consul
    mode: "0600"
  when: "'consul_servers' in group_names"
  notify:
    - Flag consul restart

- name: Enable systemd service
  ansible.builtin.systemd_service:
    name: consul.service
    enabled: true
