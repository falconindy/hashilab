---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    dpkg_options: "force-confdef,force-confold"
    state: present

# Debian's unit stops with `nft flush ruleset`, which would also wipe the tables
# Docker, Nomad's CNI plugins and Tailscale own. Scope stop to our table.
- name: Scope nftables.service stop to our table
  ansible.builtin.copy:
    src: os/etc/systemd/system/nftables.service.d
    dest: /etc/systemd/system
    mode: "0644"
  notify:
    - Reload systemd units

- name: Flush handlers so the drop-in is live before the service is touched
  ansible.builtin.meta: flush_handlers

- name: Render ruleset
  ansible.builtin.template:
    src: os/etc/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  register: firewall_ruleset

- name: Enable nftables.service so the ruleset loads at boot
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true

# Apply with a dead-man's switch: a transient timer restores the ruleset that
# was live before this apply (and /etc/nftables.conf, so a reboot can't bring the
# bad rules back) unless a brand-new SSH connection gets through after the load
# and disarms it. Only if the snapshot itself won't load does it fall back to
# deleting our table: open-but-reachable beats locked out. The check
# is a real ssh from the controller with multiplexing off, not
# `meta: reset_connection` -- meta tasks ignore `when` (and warn), and tasks in
# an include inherit the include's `when`, so the meta ran (and warned) anyway.
- name: Apply ruleset with automatic rollback
  when: firewall_ruleset.changed # noqa: no-handler
  block:
    # `nft list table` output can't be loaded over a live table (it would merge,
    # not replace), so give it the same declare-then-delete header as the
    # template. On a first-ever apply there's no table and the snapshot is just
    # the header: rolling back then means "no table", the pre-role state.
    # Validated here so a snapshot that wouldn't load aborts before the load.
    - name: Snapshot the live ruleset for rollback
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          {
            echo 'table inet hashilab'
            echo 'delete table inet hashilab'
            nft -s list table inet hashilab 2>/dev/null || true
          } > {{ firewall_rollback_snapshot }}
          nft -c -f {{ firewall_rollback_snapshot }}
        executable: /bin/bash
      changed_when: false

    - name: Arm rollback timer
      ansible.builtin.command:
        argv:
          - systemd-run
          - --collect
          - --unit=nftables-rollback
          - --on-active={{ firewall_rollback_seconds }}
          # systemd's default AccuracySec=1min lets the timer fire up to a
          # minute late; keep the rollback where firewall_rollback_seconds says.
          - --timer-property=AccuracySec=1s
          - /bin/sh
          - -c
          - >-
            if nft -f {{ firewall_rollback_snapshot }}; then
            cp {{ firewall_rollback_snapshot }} /etc/nftables.conf;
            else nft delete table inet hashilab; fi
      changed_when: true

    - name: Load ruleset
      ansible.builtin.command:
        argv: [nft, -f, /etc/nftables.conf]
      changed_when: true

    # become: false -- Deploy All is become:true, and a sudo'd localhost task
    # loses SSH_AUTH_SOCK (the Vault-signed cert lives in the user's agent).
    - name: Confirm a fresh, non-multiplexed SSH connection still works
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -p
          - "{{ ansible_port | default(22) }}"
          - "{{ ansible_user | default('root') }}@{{ ansible_host }}"
          - "true"
      register: firewall_fresh_ssh
      until: firewall_fresh_ssh.rc == 0
      retries: 3
      delay: 5
      changed_when: false

    - name: Disarm rollback timer
      ansible.builtin.systemd_service:
        name: nftables-rollback.timer
        state: stopped
