---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    dpkg_options: "force-confdef,force-confold"
    state: present

# Debian's unit stops with `nft flush ruleset`, which would also wipe the tables
# Docker, Nomad's CNI plugins and Tailscale own. Scope stop to our table.
- name: Scope nftables.service stop to our table
  ansible.builtin.copy:
    src: os/etc/systemd/system/nftables.service.d
    dest: /etc/systemd/system
    mode: "0644"
  notify:
    - Reload systemd units

- name: Flush handlers so the drop-in is live before the service is touched
  ansible.builtin.meta: flush_handlers

- name: Render ruleset
  ansible.builtin.template:
    src: os/etc/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  register: firewall_ruleset

- name: Enable nftables.service so the ruleset loads at boot
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true

# Apply with a dead-man's switch: a transient timer deletes our table unless a
# brand-new SSH connection gets through after the load and disarms it. The check
# is a real ssh from the controller with multiplexing off, not
# `meta: reset_connection` -- meta tasks ignore `when` (and warn), and tasks in
# an include inherit the include's `when`, so the meta ran (and warned) anyway.
- name: Apply ruleset with automatic rollback
  when: firewall_ruleset.changed # noqa: no-handler
  block:
    - name: Arm rollback timer
      ansible.builtin.command:
        argv:
          - systemd-run
          - --collect
          - --unit=nftables-rollback
          - --on-active={{ firewall_rollback_seconds }}
          - /usr/sbin/nft
          - delete
          - table
          - inet
          - hashilab
      changed_when: true

    - name: Load ruleset
      ansible.builtin.command:
        argv: [nft, -f, /etc/nftables.conf]
      changed_when: true

    # become: false -- Deploy All is become:true, and a sudo'd localhost task
    # loses SSH_AUTH_SOCK (the Vault-signed cert lives in the user's agent).
    - name: Confirm a fresh, non-multiplexed SSH connection still works
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -p
          - "{{ ansible_port | default(22) }}"
          - "{{ ansible_user | default('root') }}@{{ ansible_host }}"
          - "true"
      register: firewall_fresh_ssh
      until: firewall_fresh_ssh.rc == 0
      retries: 3
      delay: 5
      changed_when: false

    - name: Disarm rollback timer
      ansible.builtin.systemd_service:
        name: nftables-rollback.timer
        state: stopped
