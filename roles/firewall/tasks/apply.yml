---
# Included from main.yml only when the rendered ruleset changed. A transient
# timer deletes our table unless a brand-new SSH connection (not the
# multiplexed one) gets through after the load and disarms it.
- name: Arm rollback timer
  ansible.builtin.command:
    argv:
      - systemd-run
      - --collect
      - --unit=nftables-rollback
      - --on-active={{ firewall_rollback_seconds }}
      - /usr/sbin/nft
      - delete
      - table
      - inet
      - hashilab
  changed_when: true

- name: Load ruleset
  ansible.builtin.command:
    argv: [nft, -f, /etc/nftables.conf]
  changed_when: true

- name: Drop the multiplexed SSH connection
  ansible.builtin.meta: reset_connection

- name: Confirm a fresh connection still works
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Disarm rollback timer
  ansible.builtin.systemd_service:
    name: nftables-rollback.timer
    state: stopped
