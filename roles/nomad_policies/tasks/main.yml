# Manage Nomad ACL policies from nomad/policies/*.hcl as the source of truth.
#
# Like vault_policies, this is a single set of API calls against the cluster
# (not per-host daemon config), so it runs once from the control node against
# the Nomad HTTP API. Auth is NOMAD_TOKEN in the environment.
#
# IMPORTANT: writing Nomad ACL policies requires a *management* token — no
# policy (not even the `admin` one this repo ships) can grant ACL administration
# in Nomad. So NOMAD_TOKEN here must be a management token, e.g. the break-glass
# subshell from `bin/nomad-mgmt`, not the day-to-day OIDC login.
#
# There's no Nomad Ansible collection, so every call goes through the raw HTTP
# API via ansible.builtin.uri (same as the vault_policies prune step). Writes
# always report `changed` — the API has no server-side diff to compare against.
- name: Manage Nomad ACL policies
  run_once: true
  delegate_to: localhost
  vars:
    nomad_token: "{{ lookup('ansible.builtin.env', 'NOMAD_TOKEN') }}"
  block:
    - name: Discover policy files in the repo
      ansible.builtin.set_fact:
        nomad_policies_files: "{{ query('fileglob', nomad_policies_dir ~ '/*.hcl') }}"

    - name: Compute desired policy names
      ansible.builtin.set_fact:
        # basename minus .hcl — admin.hcl -> policy "admin".
        nomad_policies_desired: "{{ nomad_policies_files | map('basename') | map('splitext') | map('first') | list }}"

    - name: Write policies from the repo
      ansible.builtin.uri:
        url: "{{ nomad_addr }}/v1/acl/policy/{{ item | basename | splitext | first }}"
        method: POST
        headers:
          X-Nomad-Token: "{{ nomad_token }}"
        body_format: json
        body:
          Name: "{{ item | basename | splitext | first }}"
          Description: "managed by ansible from nomad/policies/{{ item | basename }}"
          Rules: "{{ lookup('file', item) }}"
        status_code: [200]
      loop: "{{ nomad_policies_files }}"
      loop_control:
        label: "{{ item | basename }}"
      changed_when: true

    - name: List policies currently in Nomad
      ansible.builtin.uri:
        url: "{{ nomad_addr }}/v1/acl/policies"
        method: GET
        headers:
          X-Nomad-Token: "{{ nomad_token }}"
        status_code: [200]
      register: nomad_policies_existing
      check_mode: false

    # Anything in Nomad but not in the repo (minus any protected policies) is a
    # stray and gets deleted. The list endpoint returns an array of policy stubs;
    # pluck the Name field from each.
    - name: Prune policies not tracked in the repo
      ansible.builtin.uri:
        url: "{{ nomad_addr }}/v1/acl/policy/{{ item }}"
        method: DELETE
        headers:
          X-Nomad-Token: "{{ nomad_token }}"
        status_code: [200]
      loop: "{{ nomad_policies_existing.json | map(attribute='Name') | difference(nomad_policies_desired) | difference(nomad_policies_protected) }}"
      changed_when: true
