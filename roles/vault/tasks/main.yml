- name: Install Apt packages
  ansible.builtin.apt:
    name:
      - vault
    dpkg_options: "force-confdef,force-confold"
    state: present
  notify:
    - Flag vault restart

- name: Enable vault service
  ansible.builtin.systemd_service:
    name: vault.service
    enabled: true

# Vault's Consul service_registration token (vault-registration policy) rendered
# into vault.hcl. Minted by tofu (module.consul_acl) and stashed in Vault KV.
# Read via a controller-side lookup, NOT a delegate_to:localhost vault_read: the
# "Deploy All" play is become:true, which sudo-scrubs VAULT_TOKEN from delegated
# tasks; lookups evaluate in the ansible-playbook process, where the OIDC login
# token (~/.vault-token) is still available.
- name: Read Vault's Consul registration token from Vault
  ansible.builtin.set_fact:
    vault_registration_token: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'consul/tokens/vault-registration',
                engine_mount_point='kv', url=vault_addr).secret.token }}
  no_log: true

- name: Update vault configuration
  ansible.builtin.template:
    src: os/etc/vault.d/vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    mode: "0644"
  notify:
    - Flag vault restart

# The raft retry_join client cert is retired: the leader's listener sets
# tls_disable_client_certs, so it was never presented, and an initialized node
# never re-joins anyway. Removed here, after vault.hcl drops its references,
# rather than in vault_agent, so a --tags vault_agent run can't delete files a
# not-yet-updated vault.hcl still points at. Drop once all servers converge.
- name: Remove retired vault raft client cert
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/vault.d/certs/client.crt
    - /etc/vault.d/private/client.key
