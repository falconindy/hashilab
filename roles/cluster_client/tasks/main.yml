- name: Add HashiCorp APT repository key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
    checksum: sha256:cafb01beac341bf2a9ba89793e6dd2468110291adfbb6c62ed11a0cde6c09029

- name: Configure HashiCorp APT repository
  ansible.builtin.copy:
    content: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com {{ hashicorp_distribution_release }} main"
    dest: /etc/apt/sources.list.d/hashicorp.list

- name: Install Apt packages
  ansible.builtin.apt:
    name:
      - vim
      - docker.io
      - podman
      - nomad
      - nomad-driver-podman
      - consul
    dpkg_options: 'force-confdef,force-confold'
    state: latest

- name: Enable systemd services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
  with_list:
    - systemd-resolved.service
    - systemd-networkd.service
    - systemd-timesyncd.service
    - nomad.service
    - consul.service
    - podman.service

- name: Setup sane editor
  alternatives:
    name: editor
    path: /usr/bin/vim.basic

- name: consul
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: os/etc/consul.d/consul.hcl.j2
      dest: /etc/consul.d/consul.hcl
    - src: os/etc/consul.d/consul.env
      dest: /etc/consul.d/consul.env
  notify:
    - Restart consul

- name: nomad
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: os/etc/nomad.d/base.hcl.j2
      dest: /etc/nomad.d/base.hcl
    - src: os/etc/nomad.d/client.hcl
      dest: /etc/nomad.d/client.hcl
  notify:
    - Restart nomad
