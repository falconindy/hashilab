- name: Deploy systemd service
  ansible.builtin.copy:
    src: os/etc/systemd/system/vault-agent.service
    dest: /etc/systemd/system/vault-agent.service
    mode: "0644"
  notify: Restart vault-agent

- name: Create config directory
  ansible.builtin.file:
    path: /etc/vault-agent.d
    state: directory
    mode: "0755"

- name: Deploy config
  ansible.builtin.template:
    src: "os/etc/vault-agent.d/{{ item.src }}"
    dest: "/etc/vault-agent.d/{{ item.dest | default(item.src) }}"
    mode: '{{ item.mode | default("0644") }}'
  loop:
    - { src: agent.hcl.j2, dest: agent.hcl }
    - { src: agent.env.j2, dest: agent.env }
  notify: Restart vault-agent

# bind_secret_id=false on this role (see tofu/modules/vault/approle/main.tf), so
# the role_id alone is the AppRole login credential — not safe to hold as a
# static file in git. Minted by tofu and read live instead of committed, same
# controller-side lookup rationale as the Consul/Nomad tokens above (the "Deploy
# All" play is become:true, which sudo-scrubs VAULT_TOKEN from delegated tasks;
# lookups evaluate in the ansible-playbook process, where the OIDC login token
# (~/.vault-token) is still available).
- name: Read the vault-agent role_id from Vault
  ansible.builtin.set_fact:
    vault_agent_role_id: >-
      {{ lookup('community.hashi_vault.vault_read', 'auth/approle/role/vault-agent/role-id',
                url=vault_addr).data.role_id }}
  no_log: true

- name: Deploy vault-agent role_id
  ansible.builtin.copy:
    content: "{{ vault_agent_role_id }}\n"
    dest: /etc/vault-agent.d/agent.roleid
    mode: "0640"
  notify: Restart vault-agent

- name: Deploy consul vault-agent config
  ansible.builtin.copy:
    src: "os/etc/vault-agent.d/{{ item }}"
    dest: "/etc/vault-agent.d/{{ item }}"
    mode: "0644"
  loop:
    - consul-tls.hcl
    - consul-server.tpl
  when: "'consul_clients' in group_names or 'consul_servers' in group_names"
  notify: Restart vault-agent

- name: Deploy nomad vault-agent config
  ansible.builtin.copy:
    src: "os/etc/vault-agent.d/{{ item }}"
    dest: "/etc/vault-agent.d/{{ item }}"
    mode: "0644"
  loop:
    - nomad-tls.hcl
    - nomad-server.tpl
  when: "'nomad_clients' in group_names or 'nomad_servers' in group_names"
  notify: Restart vault-agent

- name: Deploy vault vault-agent config
  ansible.builtin.copy:
    src: "os/etc/vault-agent.d/{{ item }}"
    dest: "/etc/vault-agent.d/{{ item }}"
    mode: "0644"
  loop:
    - vault-tls.hcl
    - vault-server.tpl
    - vault-client.tpl
  when: "'vault_servers' in group_names"
  notify: Restart vault-agent

- name: Create vault TLS cert/key directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: vault
    group: vault
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/vault.d/certs, mode: "0755" }
    - { path: /etc/vault.d/private, mode: "0700" }
  when: "'vault_servers' in group_names"

# The omada host's vault-agent issues omada-controller's server cert and pushes it
# into Vault KV; the Nomad job reads it back. Scoped to the single omada host so
# there's exactly one cert writer. The token sink and rendered cert/key live under
# /run/vault-agent (tmpfs, created by the unit's RuntimeDirectory) so the key never
# lands on persistent/NFS storage; the authoritative copy lives in Vault KV.
- name: Deploy omada-controller vault-agent config
  ansible.builtin.copy:
    src: "os/etc/vault-agent.d/{{ item.src }}"
    dest: "/etc/vault-agent.d/{{ item.src }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: omada-controller-tls.hcl, mode: "0644" }
    - { src: omada-controller.tpl, mode: "0644" }
    - { src: omada-push-kv.sh, mode: "0755" }
  when: "'omada_controller' in group_names"
  notify: Restart vault-agent

- name: Enable systemd services
  ansible.builtin.systemd_service:
    name: vault-agent.service
    enabled: true
