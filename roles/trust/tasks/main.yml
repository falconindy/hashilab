# OS-agnostic trust layer: make a host trust the home Root CA and the Vault SSH
# client CA. Kept separate from `base` (Debian packages, NFS client) so hosts
# that aren't Debian — e.g. the Synology NAS — can establish trust without
# pulling in apt/mount tasks.
- name: Internal Root CA installation
  block:
    - name: Fetch Root CA Public Certificate from Vault
      community.hashi_vault.vault_read:
        url: "{{ vault_addr }}"
        path: pki/cert/ca
        auth_method: none
      register: trust_root_ca_info
      delegate_to: localhost
      run_once: true

    - name: Copy CA cert to trusted anchors
      ansible.builtin.copy:
        content: "{{ trust_root_ca_info.data.data.certificate }}"
        dest: /usr/local/share/ca-certificates/home.crt
        mode: "0644"
      register: trust_root_ca_file

    # Only refresh the trust store when the cert changed. Kept inline (not a
    # handler) because the SSH user CA block below makes an HTTPS call to Vault
    # that needs the CA trusted now, not at end-of-play handler flush.
    - name: Update CA store # noqa: no-handler
      ansible.builtin.command: update-ca-certificates
      when: trust_root_ca_file.changed
      changed_when: true

# Trust the Vault SSH client CA so OIDC-signed certs (bin/vault-ssh) can log in.
# The /public_key endpoint is unauthenticated; fetched over TLS validated by the
# Root CA installed above. Stood up by bin/vault-build-ssh.
- name: SSH user CA trust
  block:
    # Fetch on the control node, not per-host: get_url does a HEAD under --check
    # and Vault's public_key endpoint only allows GET (405 on HEAD). uri always
    # GETs; check_mode:false keeps this read-only fetch running under --check so
    # the copy below still has content to compare. Mirrors the Root CA fetch.
    - name: Fetch SSH user CA public key from Vault
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/ssh-client-signer/public_key"
        return_content: true
      register: trust_ssh_ca
      delegate_to: localhost
      run_once: true
      check_mode: false

    - name: Install the SSH user CA public key
      ansible.builtin.copy:
        content: "{{ trust_ssh_ca.content }}"
        dest: /etc/ssh/trusted-user-ca-keys.pem
        mode: "0644"
        owner: root
        group: root
      notify: Reload ssh

    - name: Configure sshd to trust the user CA
      ansible.builtin.copy:
        content: "TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem\n"
        dest: /etc/ssh/sshd_config.d/10-vault-user-ca.conf
        mode: "0644"
        owner: root
        group: root
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh
