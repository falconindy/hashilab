vrrp_instance VI_1 {
  state MASTER
  interface enp1s0
  virtual_router_id 51
  priority 100
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass 45507f63
  }

  virtual_ipaddress {
    10.0.100.109/24 dev enp1s0
  }

  # Allow packets addressed to the VIPs above to be received
  accept
}

virtual_server 10.0.100.109 {
  delay_loop 6
  lb_algo rr
  lb_kind NAT
  protocol TCP

  real_server 10.0.100.100 443 {
    TCP_CHECK {
      connect_timeout 5
    }
  }
  real_server 10.0.100.101 443 {
    TCP_CHECK {
      connect_timeout 5
    }
  }
  real_server 10.0.100.102 443 {
    TCP_CHECK {
      connect_timeout 5
    }
  }
}
