<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#6750a4" />
    <title>Homelab Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- Material 3 baseline tokens (light) ---- */
      :root {
        --md-primary: #6750a4;
        --md-on-primary: #ffffff;
        --md-primary-container: #eaddff;
        --md-on-primary-container: #21005d;

        --md-surface: #fef7ff;
        --md-surface-container-low: #f7f2fa;
        --md-surface-container: #f3edf7;
        --md-surface-container-high: #ece6f0;
        --md-on-surface: #1d1b20;
        --md-on-surface-variant: #49454f;
        --md-outline: #79747e;
        --md-outline-variant: #cac4d0;

        /* soft tonal container behind the brand glyphs */
        --md-icon-surface: #e6e1e9;
        --md-icon-state: #1d1b20;

        /* status: tonal containers + on-container text */
        --md-ok: #146c2e;
        --md-ok-container: #c4eed0;
        --md-on-ok-container: #00210b;
        --md-warn: #7a5900;
        --md-warn-container: #ffdf9e;
        --md-on-warn-container: #271900;
        --md-err: #ba1a1a;
        --md-err-container: #ffdad6;
        --md-on-err-container: #410002;

        /* state layer opacities per M3 spec */
        --state-hover: 0.08;
        --state-focus: 0.1;

        /* elevation shadows (M3 levels 1-3) */
        --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3),
          0 1px 3px 1px rgba(0, 0, 0, 0.15);
        --elev-2: 0 1px 2px rgba(0, 0, 0, 0.3),
          0 2px 6px 2px rgba(0, 0, 0, 0.15);
        --elev-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15),
          0 1px 3px rgba(0, 0, 0, 0.3);

        --radius-card: 16px;
        --radius-full: 999px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --md-primary: #d0bcff;
          --md-on-primary: #381e72;
          --md-primary-container: #4f378b;
          --md-on-primary-container: #eaddff;

          --md-surface: #141218;
          --md-surface-container-low: #1d1b20;
          --md-surface-container: #211f26;
          --md-surface-container-high: #2b2930;
          --md-on-surface: #e6e0e9;
          --md-on-surface-variant: #cac4d0;
          --md-outline: #938f99;
          --md-outline-variant: #49454f;

          --md-icon-surface: #2b2930;
          --md-icon-state: #ffffff;

          --md-ok: #6dd58c;
          --md-ok-container: #00522a;
          --md-on-ok-container: #97f7b5;
          --md-warn: #ffba18;
          --md-warn-container: #5c4200;
          --md-on-warn-container: #ffdf9e;
          --md-err: #ffb4ab;
          --md-err-container: #93000a;
          --md-on-err-container: #ffdad6;

          --elev-1: 0 1px 3px 1px rgba(0, 0, 0, 0.5);
          --elev-2: 0 2px 6px 2px rgba(0, 0, 0, 0.5);
          --elev-3: 0 4px 8px 3px rgba(0, 0, 0, 0.55);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Roboto",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--md-surface);
        color: var(--md-on-surface);
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("falconindustries.png");
        background-size: min(900px, 78%);
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.1;
        z-index: -1;
        pointer-events: none;
      }

      /* ---- Top app bar ---- */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        max-width: 1280px;
        margin: 0 auto 24px;
        padding: 8px 8px 16px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        height: 40px;
        width: auto;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: 0;
        margin: 0;
        line-height: 1.2;
      }

      h1 span {
        color: var(--md-on-surface);
        font-weight: 500;
      }

      .top-links {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-left: 16px;
        margin-left: 4px;
        border-left: 1px solid var(--md-outline-variant);
      }

      /* Material filled tonal icon buttons: circular, state layer on hover */
      .top-links a {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-full);
        background: var(--md-icon-surface);
        overflow: hidden;
        transition: box-shadow 0.15s ease;
      }

      .top-links a:hover {
        box-shadow: var(--elev-1);
      }

      .top-links a::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--md-icon-state);
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .top-links a:hover::before {
        opacity: var(--state-hover);
      }

      .top-links a:active::before {
        opacity: 0.12;
      }

      .top-links img {
        height: 22px;
        width: 22px;
        position: relative;
      }

      /* ---- Outlined search field ---- */
      .search-container {
        position: relative;
        display: flex;
        align-items: center;
        width: min(280px, 100%);
      }

      .search-icon {
        position: absolute;
        left: 12px;
        width: 20px;
        height: 20px;
        color: var(--md-on-surface-variant);
        pointer-events: none;
      }

      #search {
        font-family: inherit;
        font-size: 0.95rem;
        background: var(--md-surface-container-high);
        border: 1px solid var(--md-outline);
        padding: 12px 40px 12px 40px;
        border-radius: var(--radius-full);
        color: var(--md-on-surface);
        width: 100%;
        outline: none;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      #search::placeholder {
        color: var(--md-on-surface-variant);
      }

      #search:focus {
        border-color: var(--md-primary);
        box-shadow: inset 0 0 0 1px var(--md-primary);
      }

      .clear-btn {
        position: absolute;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-full);
        color: var(--md-on-surface-variant);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease;
        user-select: none;
      }

      .clear-btn:hover {
        background: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
        color: var(--md-on-surface);
      }

      .clear-btn svg {
        width: 18px;
        height: 18px;
      }

      /* ---- Card grid ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
      }

      /* Material filled card */
      .card {
        position: relative;
        display: block;
        background: var(--md-surface-container-low);
        padding: 20px;
        border-radius: var(--radius-card);
        text-decoration: none;
        color: var(--md-on-surface);
        border: 1px solid var(--md-outline-variant);
        box-shadow: var(--elev-1);
        overflow: hidden;
        transition:
          box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1),
          transform 0.2s cubic-bezier(0.2, 0, 0, 1),
          border-color 0.2s ease;
      }

      /* state layer */
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--md-primary);
        opacity: 0;
        transition: opacity 0.15s ease;
        pointer-events: none;
      }

      .card:hover {
        box-shadow: var(--elev-3);
        transform: translateY(-2px);
      }

      .card:hover::after {
        opacity: var(--state-hover);
      }

      .card:focus {
        outline: none;
        box-shadow: var(--elev-2);
        border-color: var(--md-primary);
      }

      .card:focus::after {
        opacity: var(--state-focus);
      }

      .card:active {
        box-shadow: var(--elev-1);
        transform: translateY(0);
      }

      /* left status accent bar */
      .status-indicator {
        position: absolute;
        top: 14px;
        bottom: 14px;
        left: 0;
        width: 4px;
        border-radius: 0 4px 4px 0;
      }

      .passing .status-indicator {
        background: var(--md-ok);
      }
      .warning .status-indicator {
        background: var(--md-warn);
      }
      .critical .status-indicator {
        background: var(--md-err);
      }

      .service-name {
        font-size: 1.15rem;
        font-weight: 500;
        line-height: 1.4;
        margin-bottom: 2px;
        padding-right: 28px;
        display: block;
      }

      .service-url {
        font-size: 0.8rem;
        color: var(--md-on-surface-variant);
        font-family: "Roboto Mono", "Cascadia Code", monospace;
        word-break: break-all;
        display: block;
      }

      /* Material assist/status chip */
      .status-text {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.72rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-weight: 500;
        margin-top: 16px;
        padding: 5px 12px 5px 10px;
        border-radius: var(--radius-full);
      }

      .passing .status-text {
        background: var(--md-ok-container);
        color: var(--md-on-ok-container);
      }
      .warning .status-text {
        background: var(--md-warn-container);
        color: var(--md-on-warn-container);
      }
      .critical .status-text {
        background: var(--md-err-container);
        color: var(--md-on-err-container);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .passing .dot {
        background: var(--md-ok);
      }
      .warning .dot {
        background: var(--md-warn);
      }
      .critical .dot {
        background: var(--md-err);
      }

      .nomad-link {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 20px;
        height: 20px;
        background-image: url("nomad.svg");
        background-size: contain;
        background-repeat: no-repeat;
        opacity: 0.35;
        cursor: pointer;
        z-index: 1;
        transition: opacity 0.15s ease;
      }

      .nomad-link:hover {
        opacity: 1;
      }

      .hidden {
        display: none;
      }

      #loader {
        text-align: center;
        color: var(--md-on-surface-variant);
        padding: 64px;
        font-size: 0.95rem;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }

        .top-links {
          padding-left: 0;
          margin-left: 0;
          border-left: none;
        }

        .search-container {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="header-left">
        <div class="brand">
          <h1><span>HomelabDash</span></h1>
        </div>
        <div class="top-links">
          <a
            href="https://nomad.service.home:4646"
            title="Nomad"
            target="_blank"
            ><img src="nomad.svg" alt="Nomad"
          /></a>
          <a
            href="https://vault.service.home:8200"
            title="Vault"
            target="_blank"
            ><img src="vault.svg" alt="Vault"
          /></a>
          <a
            href="https://consul.service.home:8501"
            title="Consul"
            target="_blank"
            ><img src="consul.svg" alt="Consul"
          /></a>
        </div>
      </div>
      <div class="search-container">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <input
          type="text"
          id="search"
          placeholder="Filter services"
          oninput="filter()"
        />
        <span
          id="clear-search"
          class="clear-btn hidden"
          onclick="clearSearch()"
          title="Clear"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>
    </div>

    <div id="loader">Loading…</div>
    <div id="dashboard" class="grid"></div>

    <script src="dashboard.js"></script>
  </body>
</html>
