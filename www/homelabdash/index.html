<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Dash</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('falconindustries.png');
            background-size: contain; /* Scale to fit while maintaining aspect ratio */
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.10;
            z-index: -1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 40px;
            position: relative; /* Keep it above the background */
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            height: 48px; /* Balanced size for impact */
            width: auto;
            border-radius: 8px; /* Optional: adds a slight rounded edge to the image */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        h1 { font-weight: 300; letter-spacing: -1px; margin: 0; }
        h1 span { color: var(--accent); font-weight: 700; }

        #search {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            width: 300px;
            outline: none;
            transition: border 0.2s;
        }
        #search:focus { border-color: var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .status-indicator {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 4px;
        }

        .passing .status-indicator { background: var(--success); box-shadow: 0 0 15px var(--success); }
        .warning .status-indicator { background: var(--warning); box-shadow: 0 0 15px var(--warning); }
        .critical .status-indicator { background: var(--danger); box-shadow: 0 0 15px var(--danger); }

        .service-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; display: block; }
        .service-url { font-size: 0.85rem; color: var(--text-dim); font-family: 'Cascadia Code', monospace; }

        .status-text {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 15px;
            color: var(--text-dim);
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .passing .dot { background: var(--success); }
        .warning .dot { background: var(--warning); }

        .hidden { display: none; }

        #loader { text-align: center; color: var(--text-dim); padding: 50px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><span>HomelabDash</span></h1>
        <input type="text" id="search" placeholder="Filter services..." oninput="filter()">
    </div>

    <div id="loader">Loading...</div>
    <div id="dashboard" class="grid"></div>

    <script src="dashboard.js"></script>
</body>
</html>
