repos:
  - repo: local
    hooks:
      - id: hcl-fmt
        name: HCL Formatting
        entry: nomad fmt
        language: system
        files: ^jobs/.*\.hcl$
        pass_filenames: true

  - repo: local
    hooks:
      - id: tofu-fmt
        name: OpenTofu Formatting
        entry: tofu fmt -recursive tofu
        language: system
        files: ^tofu/.*\.tf$
        # `tofu fmt` takes a directory, not file paths, so format the whole tree.
        pass_filenames: false

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff
        language: system
        types: [python]
        args: ["format"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        # Upstream ships this hook with `always_run: true`, so it fires on every
        # commit regardless of `files`. Turn that off and gate it on the Ansible
        # config paths so it only runs when Ansible content actually changes.
        always_run: false
        files: ^(site\.yml|ansible\.cfg|requirements\.yml|roles/|inventory/)
        # Collections (community.general etc.) are resolved from requirements.yml.
        additional_dependencies:
          - ansible-core
