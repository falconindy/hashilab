repos:
  - repo: local
    hooks:
      - id: hcl-fmt
        name: HCL Formatting
        entry: nomad fmt
        language: system
        files: ^jobs/.*\.hcl$
        pass_filenames: true

  - repo: local
    hooks:
    -   id: ruff
        name: ruff
        entry: ruff
        language: system
        types: [python]
        args: ['format']
