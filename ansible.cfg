[defaults]
inventory = inventory/hosts.yml
# Connect as root with a Vault-signed SSH cert loaded by bin/vault-ssh-agent.
# site.yml still declares `become: sudo`; from root that escalation is a no-op.
remote_user = root

[ssh_connection]
# Reuse connections within a run so an expiring cert only affects new sessions.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
