mqtt:
  - sensor:
      name: Temperature
      default_entity_id: sensor.marasroom_acurite_temperature
      device_class: temperature
      unit_of_measurement: °C
      value_template: "{{ value_json.temperature_C | round(1) }}"
      state_topic: rtl_433/Acurite-Tower/14279
      state_class: measurement
      unique_id: acurite_temperature_14279
      device: &id001
        identifiers:
          - acurite_14279
        manufacturer: Acurite
        model: 06044M
        name: Acurite
  - sensor:
      name: Humidity
      default_entity_id: sensor.marasroom_acurite_humidity
      device_class: humidity
      unit_of_measurement: "%"
      value_template: "{{ value_json.humidity }}"
      state_topic: rtl_433/Acurite-Tower/14279
      state_class: measurement
      unique_id: acurite_humidity_14279
      device: *id001
  - binary_sensor:
      name: Battery
      default_entity_id: binary_sensor.marasroom_acurite_battery
      device_class: battery
      state_topic: rtl_433/Acurite-Tower/14279
      value_template: "{{ 'OFF' if value_json.battery_ok else 'ON' }}"
      unique_id: acurite_battery_14279
      device: *id001
