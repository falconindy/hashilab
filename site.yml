- name: Deploy All
  # The Synology NAS is not Debian and can't take the apt/systemd roles below;
  # it gets its own play at the end of this file.
  hosts: all:!synology
  become: true
  become_method: ansible.builtin.sudo
  roles:
    # OS-agnostic trust bootstrap.
    - role: trust
      tags: ["trust"]

    # Debian-only base: apt packages, editor alternative, clusterdata NFS client.
    - role: base
      tags: ["base"]
      when: ansible_facts['os_family'] == 'Debian'

    - role: systemd
      tags: ["systemd"]

    - role: keepalived
      tags: ["keepalived"]
      when: "'keepalived_servers' in group_names"

    - role: consul
      tags: ["consul"]

    - role: nomad
      tags: ["nomad"]

    - role: vault
      tags: ["vault"]
      when: "'vault_servers' in group_names"

    # Reconcile Vault ACL policies from vault/policies/*.hcl. Control-node,
    # run-once, operator-token work (see the role) — kept in this real-host play
    # (not a hosts: localhost play) so group_vars/all.yml's vault_addr is in
    # scope via delegate_to: localhost.
    - role: vault_policies
      tags: ["vault_policies"]

    - role: vault_agent
      tags: ["vault_agent"]

# Config/package changes to consul, nomad, and vault deliberately do NOT restart
# the daemon in place — that would risk quorum on a three-node control plane.
# Each role instead flags its host (the *_restart_needed facts, set by handlers).
# This play collects those flags and prints the health-aware `nom rollingrestart`
# commands to run by hand. Tagged `always` so the report shows even on a tag-
# scoped run (e.g. --tags consul).
- name: Report pending control-plane restarts
  hosts: all
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Collect hosts needing a restart, per service # noqa: run-once[task]
      run_once: true
      delegate_to: localhost
      ansible.builtin.set_fact:
        pending_restarts: >-
          {{
            pending_restarts | default({}) | combine({
              item: (
                groups['all'] | map('extract', hostvars)
                | selectattr(item ~ '_restart_needed', 'defined')
                | map(attribute='inventory_hostname') | list
              )
            })
          }}
      loop:
        - consul
        - nomad
        - vault

    - name: Report rolling restarts to run # noqa: run-once[task]
      run_once: true
      delegate_to: localhost
      vars:
        pending: "{{ pending_restarts | dict2items | selectattr('value') | list }}"
      ansible.builtin.debug:
        msg: |-
          {% if pending %}
          Control-plane config/packages changed. These were NOT restarted —
          run the health-aware rolling restart by hand:
          {% for p in pending %}
            nom rollingrestart {{ p.key }}   # changed on: {{ p.value | join(', ') }}
          {% endfor %}
          {% else %}
          All control-plane config converged; no rolling restart needed.
          {% endif %}

# The Synology NAS: not Debian, so it runs its own thin role (Consul client
# config only). Connection identity comes from group_vars/synology.yml.
- name: Deploy Synology
  hosts: synology
  gather_facts: false
  become: true
  become_method: ansible.builtin.sudo
  roles:
    - role: synology
      tags: ["synology"]
