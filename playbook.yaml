- name: Install packages
  hosts: homelab
  become: True
  become_method: sudo
  vars:
    ansible_python_interpreter: /usr/bin/python3
    hashicorp_distribution_release: bookworm
  tasks:
    - name: Add HashiCorp APT repository key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        checksum: sha256:cafb01beac341bf2a9ba89793e6dd2468110291adfbb6c62ed11a0cde6c09029

    - name: Configure HashiCorp APT repository
      ansible.builtin.copy:
        content: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com {{ hashicorp_distribution_release }} main"
        dest: /etc/apt/sources.list.d/hashicorp.list

    - name: Install Apt packages
      ansible.builtin.apt:
        name:
          - keepalived
          - nomad
          - consul
          - vault
        dpkg_options: 'force-confdef,force-confold'
        state: latest

- name: Deploy configurations
  hosts: homelab
  become: True
  become_method: sudo
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: systemd
      ansible.builtin.copy:
        src: os/etc/systemd
        dest: /etc

    - name: sysctl
      ansible.builtin.copy:
        src: os/etc/sysctl.d
        dest: /etc
      notify:
        - Apply sysctl

    - name: keepalived
      ansible.builtin.copy:
        src: os/etc/keepalived/keepalived.{{ ansible_facts['nodename'] }}.conf
        dest: /etc/keepalived/keepalived.conf
      notify:
        - Restart keepalived

    - name: consul
      ansible.builtin.copy:
        src: os/etc/consul.d
        dest: /etc
      notify:
        - Restart consul

    - name: vault
      ansible.builtin.copy:
        src: os/etc/vault.d
        dest: /etc
      notify:
        - Restart vault

    - name: nomad
      ansible.builtin.copy:
        src: os/etc/nomad.d
        dest: /etc
      notify:
        - Restart nomad

  handlers:
    - name: Restart keepalived
      ansible.builtin.systemd_service:
        name: keepalived.service
        state: reloaded

    - name: Restart nomad
      ansible.builtin.systemd_service:
        name: nomad.service
        state: reloaded

    - name: Restart consul
      ansible.builtin.systemd_service:
        name: consul.service
        state: reloaded

    - name: Restart vault
      ansible.builtin.systemd_service:
        name: vault.service
        state: reloaded

    - name: Apply sysctl
      ansible.builtin.systemd_service:
        name: systemd-sysctl.service
        state: reloaded
